<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5147e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Turni demo">
  <title>Turni demo</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20233a;background:#f6f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:linear-gradient(160deg,#eef0ff 0,#f8f9fc 35%,#eef7ff 100%)}button{font:inherit}
    .app-header{padding:calc(18px + env(safe-area-inset-top)) 18px 12px}.header-shell,.calendar-card,.day-card{max-width:680px;margin:auto;background:rgba(255,255,255,.9);border:1px solid #e4e6f2;box-shadow:0 18px 50px rgba(38,42,80,.10)}.header-shell{border-radius:22px;padding:17px;display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:14px;background:#5147e5;color:white;display:grid;place-items:center;font-weight:800}.identity{display:flex;gap:12px;align-items:center}.identity h1{font-size:1.05rem;margin:0}.identity p{color:#66708e;font-size:.82rem;margin:3px 0 0}.calendar-page{padding:0 18px 32px}.calendar-card{border-radius:22px;padding:16px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.toolbar h2{font-size:1rem;margin:0;text-align:center}.toolbar small{display:block;text-align:center;color:#66708e;margin-top:3px}.icon-btn,.today{border:0;background:#eef0ff;color:#5147e5;min-width:38px;height:38px;border-radius:12px;font-weight:700;cursor:pointer}.today{height:auto;padding:6px 10px;margin-top:6px}.weekday,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekday{margin:18px 2px 6px;color:#737c9a;font-size:.7rem;text-align:center;font-weight:700}.day{min-height:56px;border:0;border-radius:14px;background:#f6f7fb;color:#28304a;font-weight:700;position:relative;cursor:pointer}.day:disabled{opacity:.4;cursor:default}.day.today{outline:2px solid #5147e5;outline-offset:1px}.badge{position:absolute;right:5px;bottom:5px;min-width:18px;padding:2px 5px;border-radius:8px;font-size:.68rem;color:white;background:#5147e5}.badge.split{background:#8b5cf6}.badge.off{background:#697386}.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:15px 0 0;color:#66708e;font-size:.75rem}.legend b{display:inline-grid;place-items:center;min-width:18px;padding:2px 4px;border-radius:7px;color:#fff;background:#5147e5}.legend b.split{background:#8b5cf6}.legend b.off{background:#697386}.hint{text-align:center;color:#66708e;font-size:.82rem;margin:15px}.day-view{position:fixed;inset:0;background:#f6f7fb;overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 18px 30px;z-index:3}.day-view[hidden]{display:none}.day-header{max-width:680px;margin:auto;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;padding-bottom:12px;background:#f6f7fb;z-index:2}.back{border:0;background:transparent;color:#5147e5;font-weight:700;cursor:pointer}.day-card{border-radius:20px;padding:18px;margin:0 auto 14px}.type{display:flex;justify-content:space-between;align-items:center;gap:8px}.type h2{margin:0;font-size:1rem}.pill{padding:5px 9px;border-radius:999px;background:#eef0ff;color:#5147e5;font-size:.72rem;font-weight:800}.pill.split{background:#f0eaff;color:#7a3ff0}.pill.off{background:#eef0f2;color:#697386}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:16px 0}.metrics div{background:#f6f7fb;border-radius:12px;padding:10px}.metrics span{display:block;color:#74809d;font-size:.72rem}.metrics strong{font-size:.92rem}.trip{border-top:1px solid #edf0f6;padding:12px 0 0;margin-top:12px}.trip strong{display:block;font-size:.88rem}.trip span{color:#66708e;font-size:.78rem}.empty{color:#66708e;text-align:center;padding:28px}
    @media(max-width:370px){.calendar-page,.app-header{padding-left:10px;padding-right:10px}.day{min-height:50px}.calendar-card{padding:12px}}
  </style>
</head>
<body>
  <header class="app-header"><div class="header-shell"><div class="identity"><div class="mark">✓</div><div><h1>Turni demo</h1><p>Planning dimostrativo · dati fittizi</p></div></div></div></header>
  <main class="calendar-page"><section class="calendar-card"><div class="toolbar"><button class="icon-btn" id="prev" aria-label="Mese precedente">‹</button><div><h2 id="month"></h2><button class="today" id="today">Oggi</button></div><button class="icon-btn" id="next" aria-label="Mese successivo">›</button></div><div class="weekday"><span>L</span><span>M</span><span>M</span><span>G</span><span>V</span><span>S</span><span>D</span></div><div class="grid" id="grid" role="grid"></div><div class="legend"><span><b>1</b> Un blocco</span><span><b class="split">2</b> Due blocchi</span><span><b class="off">R</b> Riposo</span></div></section><p class="hint">Tocca una data per vedere il turno completo.</p></main>
  <section class="day-view" id="view" hidden><header class="day-header"><button class="back" id="back">‹ Calendario</button><strong id="dateLabel"></strong><span></span></header><article class="day-card" id="detail"></article></section>
  <script>
    const schedule={}; const now=new Date(); const demoYear=now.getFullYear(),demoMonth=now.getMonth();
    [[3,'single'],[4,'split'],[5,'off'],[8,'single'],[10,'split'],[12,'off'],[15,'single']].forEach(([day,type])=>schedule[`${demoYear}-${demoMonth}-${day}`]=type);
    let shown=new Date(demoYear,demoMonth,1); const grid=document.querySelector('#grid'),view=document.querySelector('#view'),detail=document.querySelector('#detail');
    const months=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
    function key(y,m,d){return `${y}-${m}-${d}`} function render(){const y=shown.getFullYear(),m=shown.getMonth();document.querySelector('#month').textContent=`${months[m]} ${y}`;grid.replaceChildren();const offset=(new Date(y,m,1).getDay()+6)%7,total=new Date(y,m+1,0).getDate();for(let i=0;i<offset;i++)grid.append(document.createElement('span'));for(let d=1;d<=total;d++){const type=schedule[key(y,m,d)],b=document.createElement('button');b.className='day';b.textContent=d;b.disabled=!type;if(now.getFullYear()===y&&now.getMonth()===m&&now.getDate()===d)b.classList.add('today');if(type){const badge=document.createElement('span');badge.className=`badge ${type}`;badge.textContent=type==='single'?'1':type==='split'?'2':'R';b.append(badge);b.onclick=()=>open(d,type)}grid.append(b)}}
    function open(d,type){const date=new Intl.DateTimeFormat('it-IT',{weekday:'long',day:'numeric',month:'long'}).format(new Date(shown.getFullYear(),shown.getMonth(),d));document.querySelector('#dateLabel').textContent=date;const title=type==='single'?'Turno unico':type==='split'?'Turno spezzato':'Riposo';const pill=type==='single'?'':type;detail.innerHTML=type==='off'?`<div class="type"><h2>${title}</h2><span class="pill off">RIPOSO</span></div><p class="empty">Nessun turno previsto.</p>`:`<div class="type"><h2>${title}</h2><span class="pill ${pill}">${type==='single'?'UNICO':'SPEZZATO'}</span></div><div class="metrics"><div><span>Presenza</span><strong>${type==='single'?'06:45–14:35':'06:20–18:10'}</strong></div><div><span>Tempo lavorato</span><strong>${type==='single'?'7h 20':'7h 45'}</strong></div><div><span>Linea</span><strong>Linea demo</strong></div><div><span>Vettura</span><strong>Vettura demo</strong></div></div><div class="trip"><strong>Deposito → Capolinea</strong><span>Dati puramente dimostrativi</span></div>`;view.hidden=false;history.pushState({detail:true},'','#turno')}
    document.querySelector('#prev').onclick=()=>{shown.setMonth(shown.getMonth()-1);render()};document.querySelector('#next').onclick=()=>{shown.setMonth(shown.getMonth()+1);render()};document.querySelector('#today').onclick=()=>{shown=new Date(demoYear,demoMonth,1);render()};document.querySelector('#back').onclick=()=>history.back();window.onpopstate=()=>view.hidden=true;if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');render();
  </script>
</body>
</html>
